<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Content Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; color: #222; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  section { margin-top: 24px; }
  #login { max-width: 320px; margin-top: 60px; }
  input { display: block; width: 100%; margin-bottom: 8px; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; cursor: pointer; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .card .client { font-size: 11px; text-transform: uppercase; color: #888; }
  .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; }
  .status.needs_review { background: #fde68a; }
  .status.approved { background: #bbf7d0; }
  #app { display: none; }
  #err { color: #c0392b; font-size: 13px; }
  .trimwrap { margin: 10px 0; user-select: none; }
  .trimtimes { font-size: 11px; color: #888; margin-bottom: 4px; }
  .trimbar { position: relative; height: 28px; background: #eee; border-radius: 5px; }
  .trimrange { position: absolute; top: 0; bottom: 0; background: #bbf7d0; }
  .trimhandle { position: absolute; top: -3px; bottom: -3px; width: 14px; margin-left: -7px;
                background: #2d6b48; border-radius: 4px; cursor: ew-resize; }

  .topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
  .tabs { display: flex; gap: 6px; }
  .tab { background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 14px; font-size: 14px; color: #555; }
  .tab.active { background: #f0f3f1; border-color: #ddd; color: #222; font-weight: 600; }
  .usermenu { position: relative; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #2d6b48; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
            cursor: pointer; }
  .usermenu-dropdown { position: absolute; right: 0; top: 44px; background: white; border: 1px solid #ddd;
                        border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); min-width: 200px; z-index: 10; }
  .usermenu-dropdown .who { padding: 10px 14px; font-size: 13px; color: #888; border-bottom: 1px solid #eee; }
  .usermenu-dropdown .company-opt { display: block; width: 100%; text-align: left; background: none; border: none;
                                     padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .usermenu-dropdown .company-opt.active { font-weight: 600; color: #2d6b48; }
  .usermenu-dropdown .company-opt:hover { background: #f7f7f7; }
  .usermenu-dropdown hr { border: none; border-top: 1px solid #eee; margin: 4px 0; }
  .usermenu-dropdown button.signout { width: 100%; text-align: left; background: none; border: none; padding: 10px 14px;
                                       font-size: 13px; cursor: pointer; color: #c0392b; }
  .companyrow { display: flex; align-items: center; justify-content: space-between; border: 1px solid #ddd;
                border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer; }
  .companyrow:hover { background: #f7f7f7; }
  .companyrow .name { font-weight: 600; }
  .companyrow .stats { display: flex; gap: 22px; font-size: 13px; color: #555; }
  .companyrow .stats .num { font-weight: 700; color: #2d6b48; font-size: 16px; display: block; }
  .companyrow .inactive { color: #bbb; font-size: 11px; }
  .companyrow .viewbtn { font-size: 12px; padding: 5px 10px; margin-left: 10px; }
  .filterchip { display: inline-block; background: #e8f3ec; color: #2d6b48; font-size: 13px;
                padding: 5px 12px; border-radius: 14px; margin-bottom: 12px; }
  .filterchip button { background: none; border: none; color: #2d6b48; font-weight: 700; cursor: pointer;
                        margin-left: 6px; padding: 0; }
</style>
</head>
<body>

<div id="login">
  <h1>Content Dashboard — Sign in</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Sign in</button>
  <div id="err"></div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tabs">
      <button class="tab" id="tab-home" onclick="showTab('home')">Home</button>
      <button class="tab" id="tab-queue" onclick="clearQueueFilter(); showTab('queue')">Approval Queue</button>
      <button class="tab" id="tab-broll" onclick="showTab('broll')">B-Roll</button>
    </div>
    <span style="flex:1;"></span>
    <div class="usermenu">
      <div class="avatar" id="avatar" onclick="toggleUserMenu()"></div>
      <div class="usermenu-dropdown" id="usermenu-dropdown" style="display:none;">
        <div class="who" id="who"></div>
        <hr>
        <button class="signout" onclick="logout()">Sign out</button>
      </div>
    </div>
  </div>

  <section id="section-home">
    <h2>All companies</h2>
    <div id="homeCompanies"></div>
  </section>

  <section id="section-queue" style="display:none;">
    <h2>Approval queue</h2>
    <div id="queueFilterChip"></div>
    <div id="posts"></div>
  </section>

  <section id="section-broll" style="display:none;">
    <h2>Raw footage (B-roll)</h2>
    <p style="color:#888; font-size:13px;">Broken out per client — as admin you see all of them.</p>
    <div id="rawMedia"></div>
  </section>
</div>

<script>
let me = null;
let myClients = [];

async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
    });
    if (!res.ok) {
        document.getElementById("err").textContent = "Wrong email or password.";
        return;
    }
    showApp();
}

async function logout() {
    await fetch("/api/logout", { method: "POST" });
    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "block";
}

function initials(name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
}

function toggleUserMenu() {
    const el = document.getElementById("usermenu-dropdown");
    el.style.display = el.style.display === "none" ? "block" : "none";
}

function showTab(tab) {
    ["home", "queue", "broll"].forEach(t => {
        document.getElementById(`section-${t}`).style.display = t === tab ? "block" : "none";
        document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
    });
}

async function showApp() {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    me = await (await fetch("/api/me")).json();
    myClients = await (await fetch("/api/clients")).json();
    document.getElementById("avatar").textContent = initials(me.name);
    document.getElementById("who").textContent = `${me.name} (${me.role})`;
    showTab("home");
    loadHomeCompanies();
    loadPosts();
    loadRawMedia();
}

// The admin view: every company at once, not filtered to whichever one is
// "active" -- that filter only matters once you're inside Queue or B-Roll.
async function loadHomeCompanies() {
    const [allPosts, brollCounts] = await Promise.all([
        fetch("/api/posts").then(r => r.json()),
        fetch("/api/raw-media").then(r => r.json()),
    ]);
    document.getElementById("homeCompanies").innerHTML = myClients.map(c => {
        const needsReview = allPosts.filter(p => p.client_id === c.id && p.status === "needs_review").length;
        const broll = brollCounts.find(b => b.slug === c.slug);
        return `
        <div class="companyrow">
            <div>
                <div class="name">${c.name}</div>
                ${!c.active ? `<div class="inactive">not yet operating</div>` : ""}
            </div>
            <div class="stats">
                <div><span class="num">${needsReview}</span>need review</div>
                <div><span class="num">${broll ? broll.count : 0}</span>raw clips</div>
                <button class="viewbtn" onclick="event.stopPropagation(); showCompanyQueue('${c.slug}')">Approval Queue</button>
                <a class="viewbtn" style="text-decoration:none; display:inline-block; border:1px solid #ccc; border-radius:4px; color:inherit;" onclick="event.stopPropagation();" href="/client.html?slug=${c.slug}">B-Roll</a>
            </div>
        </div>`;
    }).join("");
}

let queueFilterSlug = null;

function showCompanyQueue(slug) {
    queueFilterSlug = slug;
    showTab("queue");
    loadPosts();
}

function clearQueueFilter() {
    queueFilterSlug = null;
    loadPosts();
}

const trimState = {}; // postId -> { start, end, duration }

async function loadPosts() {
    const all = await (await fetch("/api/posts")).json();
    const filterClient = queueFilterSlug ? myClients.find(c => c.slug === queueFilterSlug) : null;
    const posts = filterClient ? all.filter(p => p.client_id === filterClient.id) : all;

    document.getElementById("queueFilterChip").innerHTML = filterClient
        ? `<span class="filterchip">${filterClient.name} only<button onclick="clearQueueFilter()">✕ show all</button></span>`
        : "";

    document.getElementById("posts").innerHTML = posts.length ? posts.map(p => `
        <div class="card">
            <div class="client">${p.clients ? p.clients.name : ""}</div>
            <span class="status ${p.status}">${p.status}</span>
            ${p.edited_media_path ? `<div style="font-size:11px; color:#2d6b48; margin-top:6px;">trimmed cut</div>` : ""}
            ${p.media_url ? `<video id="video-${p.id}" src="${p.media_url}" controls style="max-width:120px; display:block; margin:8px 0; border-radius:4px;"></video>` : ""}
            <p style="white-space:pre-wrap;">${p.caption_draft || "(no caption yet)"}</p>
            ${p.media_url ? `
            <div class="trimwrap">
                <div class="trimtimes" id="trimtimes-${p.id}">Start: 0.0s — End: 0.0s</div>
                <div class="trimbar" id="trimbar-${p.id}">
                    <div class="trimrange" id="trimrange-${p.id}"></div>
                    <div class="trimhandle" id="trimhandle-start-${p.id}" data-role="start"></div>
                    <div class="trimhandle" id="trimhandle-end-${p.id}" data-role="end"></div>
                </div>
                <button onclick="trim('${p.id}')" style="margin-top:8px;">Trim to this section</button>
            </div>` : ""}
            ${p.status === "needs_review" ? `<button onclick="approve('${p.id}')">Approve</button>` : ""}
        </div>
    `).join("") : "<p>Nothing waiting on review.</p>";

    posts.forEach(p => {
        if (!p.media_url) return;
        const video = document.getElementById(`video-${p.id}`);
        video.addEventListener("loadedmetadata", () => initTrimBar(p.id, video.duration));
    });
}

function initTrimBar(postId, duration) {
    trimState[postId] = { start: 0, end: duration, duration };
    renderTrimBar(postId);

    const bar = document.getElementById(`trimbar-${postId}`);
    ["start", "end"].forEach(role => {
        const handle = document.getElementById(`trimhandle-${role}-${postId}`);
        handle.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const onMove = (moveEvent) => {
                const rect = bar.getBoundingClientRect();
                let frac = (moveEvent.clientX - rect.left) / rect.width;
                frac = Math.max(0, Math.min(1, frac));
                const t = frac * duration;
                const s = trimState[postId];
                if (role === "start") s.start = Math.min(t, s.end - 0.1);
                else s.end = Math.max(t, s.start + 0.1);
                s.start = Math.max(0, s.start);
                s.end = Math.min(duration, s.end);
                renderTrimBar(postId);
                document.getElementById(`video-${postId}`).currentTime = role === "start" ? s.start : s.end;
            };
            const onUp = () => {
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);
            };
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    });
}

function renderTrimBar(postId) {
    const s = trimState[postId];
    const startPct = (s.start / s.duration) * 100;
    const endPct = (s.end / s.duration) * 100;
    document.getElementById(`trimhandle-start-${postId}`).style.left = `${startPct}%`;
    document.getElementById(`trimhandle-end-${postId}`).style.left = `${endPct}%`;
    document.getElementById(`trimrange-${postId}`).style.left = `${startPct}%`;
    document.getElementById(`trimrange-${postId}`).style.width = `${endPct - startPct}%`;
    document.getElementById(`trimtimes-${postId}`).textContent =
        `Start: ${s.start.toFixed(1)}s — End: ${s.end.toFixed(1)}s`;
}

async function trim(postId) {
    const s = trimState[postId];
    const res = await fetch(`/api/posts/${postId}/trim`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start: s.start, end: s.end }),
    });
    if (!res.ok) { alert("Trim failed: " + (await res.json()).error); return; }
    loadPosts();
}

async function loadRawMedia() {
    const counts = await (await fetch("/api/raw-media")).json();
    document.getElementById("rawMedia").innerHTML = counts.length ? counts.map(c => `
        <a class="card" style="display:block; text-decoration:none; color:inherit;" href="/client.html?slug=${c.slug}">
            <strong>${c.name}</strong> — ${c.count} clip${c.count === 1 ? "" : "s"}
        </a>
    `).join("") : "<p>Nothing in any bin yet.</p>";
}

async function approve(id) {
    await fetch(`/api/posts/${id}/approve`, { method: "POST" });
    loadPosts();
}

// If a session cookie is already valid, skip straight past the login form.
fetch("/api/me").then(r => { if (r.ok) showApp(); });
</script>

</body>
</html>
